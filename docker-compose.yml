services:
    web:
        build: .
        env_file:
            - .env
        volumes:
            - .:/app
        ports:
            - "3000:3000"
        depends_on:
            - postgres

    postgres:
        image: postgres:13
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        env_file:
            - .env
        ports:
            - "${POSTGRES_PORT}:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

    redis:
        image: redis:latest
        container_name: redis
        restart: unless-stopped
        ports:
        - "6379:6379"
        volumes:
        - redis_data:/data       

    mailcatcher:
        image: sj26/mailcatcher
        ports:
        - "1080:1080"  # Web interface
        - "1025:1025"  # SMTP server
        restart: unless-stopped
volumes:
    pgdata: {}
    redis_data: {}